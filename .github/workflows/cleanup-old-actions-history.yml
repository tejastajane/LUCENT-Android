name: Clean old Actions history

on:
  push:
    branches:
      - "maintenance/cleanup-action-history"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: cleanup-actions-history
  cancel-in-progress: false

jobs:
  cleanup:
    name: Remove stale completed workflow runs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Keep newest usable Android build and all in-progress runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          runs_json_query='.workflow_runs[] | [.id, .status, .created_at, .name, .conclusion] | @tsv'
          mapfile -t run_rows < <(
            gh api --paginate "repos/${REPOSITORY}/actions/runs?per_page=100" --jq "${runs_json_query}"
          )

          keep_completed_id="$(
            printf '%s\n' "${run_rows[@]}" |
              awk -F '\t' '$2 == "completed" && $4 == "Android build and playback test" && $5 != "cancelled" && $5 != "skipped" { print $1 "\t" $3 }' |
              sort -t $'\t' -k2,2r |
              head -n 1 |
              cut -f1
          )"

          if [[ -z "${keep_completed_id}" ]]; then
            echo "No completed usable Android build exists; keeping all in-progress runs."
            keep_completed_id="__keep_no_completed_build__"
          else
            echo "Keeping newest usable Android build run: ${keep_completed_id}"
          fi

          deleted=0
          while IFS=$'\t' read -r run_id status created_at workflow_name conclusion; do
            [[ -n "${run_id}" ]] || continue
            # Active runs are never deleted; they may be generating the next APK.
            [[ "${status}" == "completed" ]] || continue
            [[ "${run_id}" == "${keep_completed_id}" ]] && continue

            echo "Deleting stale completed run ${run_id} (${workflow_name}, ${conclusion}, ${created_at})"
            gh api --silent --method DELETE "repos/${REPOSITORY}/actions/runs/${run_id}"
            deleted=$((deleted + 1))
          done < <(printf '%s\n' "${run_rows[@]}" | sort -t $'\t' -k3,3r)

          echo "Cleanup finished. Deleted ${deleted} old completed workflow runs."
