name: Build LUCENT APK

on:
  push:
    branches:
      - main
      - "implementation/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lucent-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-lucent-apk:
    name: Build and install-test production APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      - name: Build production APK
        run: gradle --no-daemon --stacktrace :app:assembleProductionDebug

      - name: Prepare APK with stable filename
        run: |
          mkdir -p app/build/distributions
          cp app/build/outputs/apk/production/debug/app-production-debug.apk app/build/distributions/lucent.apk
          (cd app/build/distributions && sha256sum lucent.apk > lucent.apk.sha256)

      - name: Upload LUCENT APK
        uses: actions/upload-artifact@v4
        with:
          name: lucent-apk
          path: |
            app/build/distributions/lucent.apk
            app/build/distributions/lucent.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Prepare emulator diagnostics folder
        if: always()
        run: mkdir -p app/build/diagnostics/emulator-install

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Validate emulator install script
        run: bash -n .github/scripts/install-apk-on-emulator.sh

      - name: Install APK on Android 16 emulator
        id: emulator-install
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash .github/scripts/install-apk-on-emulator.sh

      - name: Upload Android emulator install diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-install-diagnostics
          path: app/build/diagnostics/emulator-install/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish latest LUCENT APK release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}"
          release_title="LUCENT build #${GITHUB_RUN_NUMBER}"
          release_notes="Automated LUCENT Android debug build.

          Commit: ${GITHUB_SHA}
          Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          This APK is intended for testing and is not a Play Store-signed release."

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" app/build/distributions/lucent.apk app/build/distributions/lucent.apk.sha256 --clobber
            gh release edit "$tag" --title "$release_title" --notes "$release_notes" --latest
          else
            gh release create "$tag" app/build/distributions/lucent.apk app/build/distributions/lucent.apk.sha256 --title "$release_title" --notes "$release_notes" --latest --target "$GITHUB_SHA"
          fi
