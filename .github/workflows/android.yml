name: Android build and playback test

on:
  push:
    branches:
      - main
      - "implementation/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build APK and test libVLC playback
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      - name: Build production APK and isolated CI test APK
        run: gradle --no-daemon --stacktrace :app:assembleProductionDebug :app:assembleCiDebug

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: liquid-player-debug-apk
          path: app/build/outputs/apk/production/debug/app-production-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Generate short local video fixture for instrumentation assets
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          mkdir -p app/src/androidTest/assets
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i testsrc2=size=320x240:rate=24 \
            -t 8 -an -c:v libx264 -preset ultrafast -pix_fmt yuv420p \
            -movflags +faststart app/src/androidTest/assets/liquidplayer-smoke.mp4

      - name: Build instrumentation test APK
        run: gradle --no-daemon --stacktrace :app:assembleCiDebugAndroidTest

      - name: Run real-app UI and libVLC smoke tests on Android emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048 -cores 2 -wipe-data
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            # Let the Android Gradle instrumentation runner install the target and test APKs together.
            # The MP4 fixture is embedded in the test APK and copied into target app cache by test code.
            mkdir -p app/build/reports/androidTests/connected
            # Stage 1: run only the real Settings screen test.
            gradle --no-daemon --stacktrace :app:connectedCiDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.tejas.liquidplayer.player.MainActivityUiSmokeTest#settingsScreenComposesWithoutCrashing || { adb logcat -d -v threadtime > app/build/reports/androidTests/connected/settings-full-logcat.txt 2>&1 || true; adb logcat -d -b crash -v threadtime > app/build/reports/androidTests/connected/settings-crash.txt 2>&1 || true; adb shell screencap -p /sdcard/liquid-player-settings.png || true; adb pull /sdcard/liquid-player-settings.png app/build/reports/androidTests/connected/settings-screen.png >/dev/null 2>&1 || true; adb shell uiautomator dump /sdcard/liquid-player-settings-window.xml >/dev/null 2>&1 || true; adb pull /sdcard/liquid-player-settings-window.xml app/build/reports/androidTests/connected/settings-window.xml >/dev/null 2>&1 || true; adb shell dumpsys activity activities > app/build/reports/androidTests/connected/settings-activities.txt 2>&1 || true; adb shell dumpsys window windows > app/build/reports/androidTests/connected/settings-windows.txt 2>&1 || true; exit 1; }
            # Stage 2: only after Settings passes, open a MediaStore video in the actual player UI.
            gradle --no-daemon --stacktrace :app:connectedCiDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.tejas.liquidplayer.player.MainActivityUiSmokeTest#selectingVideoOpensRealPlayerScreenWithoutCrashing || { adb logcat -d -v threadtime > app/build/reports/androidTests/connected/player-ui-full-logcat.txt 2>&1 || true; adb logcat -d -b crash -v threadtime > app/build/reports/androidTests/connected/player-ui-crash.txt 2>&1 || true; adb shell screencap -p /sdcard/liquid-player-player-ui.png || true; adb pull /sdcard/liquid-player-player-ui.png app/build/reports/androidTests/connected/player-ui-screen.png >/dev/null 2>&1 || true; adb shell uiautomator dump /sdcard/liquid-player-player-ui-window.xml >/dev/null 2>&1 || true; adb pull /sdcard/liquid-player-player-ui-window.xml app/build/reports/androidTests/connected/player-ui-window.xml >/dev/null 2>&1 || true; adb shell dumpsys activity activities > app/build/reports/androidTests/connected/player-ui-activities.txt 2>&1 || true; adb shell dumpsys window windows > app/build/reports/androidTests/connected/player-ui-windows.txt 2>&1 || true; exit 1; }
            # Stage 3: libVLC engine playback is deliberately last.
            gradle --no-daemon --stacktrace :app:connectedCiDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.tejas.liquidplayer.player.LibVlcPlaybackSmokeTest || { adb logcat -d -v threadtime > app/build/reports/androidTests/connected/libvlc-full-logcat.txt 2>&1 || true; adb logcat -d -b crash -v threadtime > app/build/reports/androidTests/connected/libvlc-crash.txt 2>&1 || true; adb shell screencap -p /sdcard/liquid-player-libvlc.png || true; adb pull /sdcard/liquid-player-libvlc.png app/build/reports/androidTests/connected/libvlc-screen.png >/dev/null 2>&1 || true; adb shell uiautomator dump /sdcard/liquid-player-libvlc-window.xml >/dev/null 2>&1 || true; adb pull /sdcard/liquid-player-libvlc-window.xml app/build/reports/androidTests/connected/libvlc-window.xml >/dev/null 2>&1 || true; adb shell dumpsys activity activities > app/build/reports/androidTests/connected/libvlc-activities.txt 2>&1 || true; adb shell dumpsys window windows > app/build/reports/androidTests/connected/libvlc-windows.txt 2>&1 || true; exit 1; }

      - name: Upload Android test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquid-player-android-test-results
          path: |
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/androidTests/connected/**
          if-no-files-found: ignore
          retention-days: 14
