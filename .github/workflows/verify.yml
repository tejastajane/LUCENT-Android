name: Verify LUCENT

on:
  push:
    branches:
      - main
      - main2
      - second-audit-implementation
      - "implementation/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lucent-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests and Android lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run focused unit tests and lint
        run: ./gradlew --no-daemon --stacktrace :app:testProductionDebugUnitTest :app:lintProductionDebug
